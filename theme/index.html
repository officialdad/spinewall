  // A rebuilt row loses focus, so a keyboard user who just toggled a box would be sent back to the top.
  const focused = document.activeElement && document.activeElement.dataset.focusKey;
  ui.charsList.replaceChildren(...layout.map(e => {
    const m = models.find(x => x.id === e.model);
    const name = m ? m.name : e.model;
    const sel = el("button", {type: "button", className: "sel", textContent: name, title: name});
    sel.dataset.focusKey = `sel:${e.uid}`;
    sel.setAttribute("aria-pressed", String(!!target && target.uid === e.uid));
    sel.setAttribute("aria-label", `Select ${name}`);
    sel.addEventListener("click", () => selectChar(e.uid));
    const box = el("input", {type: "checkbox", checked: !!e.auto});
    box.dataset.focusKey = `auto:${e.uid}`;
    box.setAttribute("aria-label", `Auto-cycle animations for ${name}`);
    box.addEventListener("change", () => { setAuto(e, box.checked); if (target && target.uid === e.uid) ui.autoBox.checked = box.checked; });
    const auto = el("label", {className: "autolabel", title: "Auto-cycle animations"}, box, el("span", {textContent: "Auto"}));
    const rm = el("button", {type: "button", className: "rm", textContent: "✕"});
    rm.dataset.focusKey = `rm:${e.uid}`;
    rm.setAttribute("aria-label", `Remove ${name}`);
    rm.addEventListener("click", () => cmd(`remove-character/${e.uid}`));
    return el("div", {className: "charrow"}, sel, auto, rm);
  }));
  if (focused) {
    const again = [...ui.charsList.querySelectorAll("[data-focus-key]")].find(x => x.dataset.focusKey === focused);
    if (again) again.focus();
  }
}

function load(modelId, animation) {
  const model = models.find(m => m.id === modelId) || models[0];
  if (!model) return;
  disposePlayer();
  const runtime = RUNTIMES[model.runtime];
  if (!runtime) { notice(`The Spine runtime for ${model.name} is not installed. Run scripts/install.sh.`); return; }
  const base = `${MODEL_ROOT}/${encodeURIComponent(model.id)}`;
  player = new runtime.SpinePlayer("p", {
    // The player reads skelUrl as binary only, so a JSON skeleton needs jsonUrl.
    [model.skeleton.endsWith(".json") ? "jsonUrl" : "skelUrl"]: `${base}/${encodeURIComponent(model.skeleton)}`,
    atlasUrl: `${base}/${encodeURIComponent(model.atlas)}`,
    skin: model.skin,
    backgroundColor: "#000000",
    alpha: false,
    // 3.8 atlases are straight alpha. The 3.8 player assumes premultiplied by default, which leaves a bright fringe.
    ...(runtime.legacy && {premultipliedAlpha: false}),
    mipmaps: false,
    showControls: false,
    success: p => {
      anims = p.skeleton.data.animations.map(a => a.name);
      const hide = hideSlotsOf(p.skeleton, model);
      if (model.hideSlots && model.hideSlots.length) {
        const update = p.skeleton.updateWorldTransform;
        p.skeleton.updateWorldTransform = function (...args) { hide(); return update.apply(this, args); };
      }
      const pick = pickAnimation(anims, animation, model.defaultAnimation);
      // The camera frames once, on the first animation. Re-framing per animation rescales the model
      // whenever an animation has wider bounds, such as a sword swing. An empty viewport blanks the canvas.
      // The player starts paused and only calls play() itself when no animation is set yet.
      if (pick && runtime.legacy) {
        // 3.8 has no setViewport. Its setAnimation frames the camera and plays, and it has already run for the first animation.
        p.setAnimation(pick, true);
      } else if (pick) {
        p.setViewport(pick);
        p.animationState.setAnimation(0, pick, true);
        p.play();
      }
      post("/report", {model: model.id, animations: anims, playing: pick});
      // The server learns the playing animation from this report and bumps no revision, so mark it here.
      state.animation = pick;
      notice("");
      if (editMode) renderAnims();
    },
    error: (p, msg) => { console.log("spine load error", model.id, msg); notice(`Could not load ${model.name}.`); }
  });
}

async function poll() {
  try {
    const s = await (await api("/state")).json();
    setEditMode(!!s.edit);
    // A drag in progress owns the layout, so a server copy waits until the push has landed.
    if (s.crev !== crev && !dragging && !layoutPending) {
      crev = s.crev;
      applyCharacters(Array.isArray(s.characters) ? s.characters : []);
    }
    // The revision is kept apart from `state`, which is replaced whole. A change that lands mid-drag or
    // while a push waits stays unseen until it can apply.
    if (s.vrev !== viewRev && !dragging && !viewPending) {
      view = {scale: s.scale, x: s.x, y: s.y};
      viewRev = s.vrev;
      applyView();
    }
    if (s.rev !== state.rev) {
      const modelChanged = s.model !== state.model || state.rev === -1;
      state = s;
      // The server records recents itself. Mirroring them keeps "last played" right until the next prefs read.
      if (modelChanged && s.model) prefs.recent = [s.model, ...prefs.recent.filter(id => id !== s.model)].slice(0, 20);
      if (editMode) { renderPicker(); }
      if (modelChanged && !multi) load(s.model, s.animation);
      // An auto-cycle step already plays the animation the server just stored, and a restart would stutter.
      else if (player && anims.includes(s.animation) && playingName() !== s.animation) player.animationState.setAnimation(0, s.animation, true);
    }
    autoCycleSingle();
    // Leaving the shared stage brings the single player back with the model the server carried over.
    if (!multi && !player && state.model) load(state.model, state.animation);
  } catch (e) {}
  setTimeout(poll, POLL_MS);
}

// The server may start after the page, so the model list retries. Polling starts at once and does not wait for it.
async function fetchModels() {
  for (let wait = 500; ; wait = Math.min(wait * 2, MODELS_RETRY_MAX_MS)) {
    try {
      const res = await api("/models");
      if (!res.ok) throw new Error(res.status);
      setModels(await res.json());
      crev = -1;
      if (ui) renderPicker();
      return;
    } catch (e) {
      await new Promise(r => setTimeout(r, wait));
    }
  }
}

poll();
fetchModels();
</script></body></html>
