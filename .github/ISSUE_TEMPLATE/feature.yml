name: Feature
description: Ask for a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach game models, textures, or Spine runtime files. Spinewall stays free of game-specific code.
  - type: input
    id: needs_you
    attributes:
      label: Needs you
      description: One line. What the maintainer must do.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 2 to 4 short sentences. What is needed and why.
    validations:
      required: true
  - type: input
    id: risk
    attributes:
      label: Risk
      description: One line, or None known.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
