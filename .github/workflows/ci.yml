name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python compiles
        run: python3 -I -m py_compile server/spinewall-server.py
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/patch-plasmoid.sh bin/spinewall
      - name: Shell lint
        run: shellcheck scripts/*.sh bin/spinewall tests/page/setup.sh
      - name: No assets or runtimes tracked
        run: |
          if git ls-files | grep -v '^docs/demo/models/' | grep -E '\.(skel|atlas)$'; then
            echo "error: model files are tracked outside docs/demo/models/."
            exit 1
          fi
          if git ls-files | grep -E 'spine-player.*\.(js|css)$'; then
            echo "error: runtime files are tracked. The runtime license forbids redistribution."
            exit 1
          fi

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Server, CLI, and script tests
        run: python3 -I -m unittest discover -s tests -t . -v
      - name: Install from the registry with pinned hashes
        env:
          SPINEWALL_TEST_NETWORK: "1"
        run: python3 -I -m unittest discover -s tests -t . -p 'test_install.py' -v

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Static binary builds
        run: CGO_ENABLED=0 go build -trimpath -o spinewall ./cmd/spinewall
      - name: Existing Python suite runs against the Go binary
        env:
          SPINEWALL_BIN: ${{ github.workspace }}/spinewall
        run: python3 -I -m unittest discover -s tests -t . -v
      - name: Differential parity, Python server vs Go server
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/state" "$work/models"
          python3 -c "import sys; from tests.server.support import build_default_models; build_default_models(sys.argv[1])" "$work/models"
          python3 tests/differential.py --go-bin ./spinewall --state-dir "$work/state" --models-dir "$work/models"

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install page test dependencies
        working-directory: tests/page
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Page tests
        working-directory: tests/page
        run: npm test
      - name: Upload test report on error
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-test-results
          path: tests/page/test-results
          if-no-files-found: ignore
          retention-days: 7
